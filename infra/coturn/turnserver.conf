# coturn TURN/STUN server configuration for Granary
# This file is mounted into the coturn Docker container.

# Network
listening-port=3478
tls-listening-port=5349

# TLS (turns: on 5349). coturn only answers TLS on 5349 once it has a certificate. To offer it:
#   1. mount the certificate folder into the coturn service in docker-compose.yml, for example
#        volumes:
#          - /etc/letsencrypt:/etc/letsencrypt:ro
#   2. uncomment the two lines below with the certificate of the TURN host name
#   3. add "turns:<host>:5349" to TURN_URIS in .env and restart coturn and the API
# Without a certificate, leave TURN_URIS on turn: only (the .env.example default).
# cert=/etc/letsencrypt/live/granary.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/granary.example.com/privkey.pem

# Relay address range — use host IP or 0.0.0.0 for all interfaces
# In Docker, set TURN_EXTERNAL_IP in .env and the compose file overrides this via CLI flags.

# Realm
realm=granary.internal

# HMAC-based time-limited credentials (no static username/password)
use-auth-secret

# The shared secret must match TURN_SECRET in .env
# Injected at runtime via --static-auth-secret= CLI flag in docker-compose.yml

# Security
no-multicast-peers
no-software-attribute
# Security 26 Oct 2026: the relay must never reach this host or the Docker network (redis, storage, postgres,
# the sidecars): peers are only public addresses. No TCP relays (browsers use UDP).
no-loopback-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
fingerprint
stale-nonce=600

# Logging
log-file=stdout
verbose

# Disable long-term credentials (we use short-term HMAC only)
lt-cred-mech
# Actually for use-auth-secret we need no lt-cred-mech:
# Uncomment the line below and remove lt-cred-mech if you get auth errors.
# no-auth
