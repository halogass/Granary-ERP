# Granary — Nginx site configuration
# Install: copy to /etc/nginx/sites-available/granary
#          then: sudo ln -s /etc/nginx/sites-available/granary /etc/nginx/sites-enabled/granary
#          then: sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run: sudo certbot --nginx -d your.domain.com
# Certbot will automatically edit this file to add the SSL directives.

# ── Real client IP behind Cloudflare ─────────────────────────────────────────
# With the Cloudflare proxy on, $remote_addr is a Cloudflare edge. For requests that really come
# from Cloudflare (and only those), take the client from CF-Connecting-IP, so the rate limits
# below and the X-Real-IP the backend logs (e-signature audit trail, kiosk limits) are per client.
# Anyone hitting the server IP directly keeps their own address and can't fake the header.
# Ranges from https://www.cloudflare.com/ips (checked 2026-09-26) — refresh if Cloudflare adds any.
# Harmless without Cloudflare: requests from other addresses are left untouched.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── Rate limiting zones (defined once in http context) ───────────────────────
# If you have multiple sites and already define these zones, remove the
# limit_req_zone lines to avoid duplicate zone errors.
limit_req_zone $binary_remote_addr zone=granary_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=granary_auth:10m rate=5r/m;

# ── Upstream services (Docker containers bound to localhost) ─────────────────
upstream granary_backend  { server 127.0.0.1:8000; keepalive 32; }
upstream granary_frontend { server 127.0.0.1:3000; keepalive 32; }
upstream granary_signal   { server 127.0.0.1:3003; keepalive 8;  }

# ── Stored files (/minio/, the S3 storage): no script ever; PDFs without `sandbox`, which Chrome's PDF viewer refuses ──
map $upstream_http_content_type $granary_minio_csp {
    ~*^application/pdf  "default-src 'none'; object-src 'self'; frame-ancestors 'self'";
    default             "default-src 'none'; sandbox";
}

# ── HTTP server ───────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;   # Replace _ with your domain when going public, e.g.: granary.example.com

    # 1 Nov 2026: 150m so a 100 MB video (nary.upload.video_max_mb) fits, also as base64 over MCP.
    client_max_body_size 150m;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header X-XSS-Protection       "1; mode=block"                  always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Defence in depth behind the upload allowlist: even if a scriptable file (svg/html) reaches a
    # user, it cannot run inline script or call out. 'unsafe-inline'/'unsafe-eval' are required by
    # Next.js's runtime; tighten to a nonce if the app ever moves off them.
    # img-src allows https: so remote images in received emails and Markdown still show (an image
    # can't run script); frame-src allows the video hosts used for partner training chapters.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # WebRTC signal service WebSocket
    location /ws/signal {
        proxy_pass         http://granary_signal;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # AI assistant: replies stream as Server-Sent Events — no buffering, long reads.
    location /api/v1/ai/ {
        proxy_pass         http://granary_backend;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend WebSocket endpoints (messaging, WhatsApp, calls)
    location ~ ^/api/v1/(messaging|whatsapp|calls)/ws {
        proxy_pass         http://granary_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # NextAuth sign-in (the login form posts here): same limit as the backend login
    location /api/auth/callback/ {
        limit_req zone=granary_auth burst=10 nodelay;
        proxy_pass         http://granary_frontend;
        proxy_set_header   x-middleware-subrequest "";   # Next.js middleware bypass (CVE-2025-29927)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # NextAuth routes — must be handled by Next.js frontend, NOT FastAPI
    location /api/auth/ {
        proxy_pass         http://granary_frontend;
        proxy_set_header   x-middleware-subrequest "";   # Next.js middleware bypass (CVE-2025-29927)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Dynamic favicon (branding) + PWA icon generator — Next.js API routes, NOT FastAPI
    location /api/favicon {
        proxy_pass         http://granary_frontend;
        proxy_set_header   x-middleware-subrequest "";   # Next.js middleware bypass (CVE-2025-29927)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /api/icons/ {
        proxy_pass         http://granary_frontend;
        proxy_set_header   x-middleware-subrequest "";   # Next.js middleware bypass (CVE-2025-29927)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # WhatsApp transcript export — walks back through chat history in the WhatsApp
    # service and renders a PDF, which routinely runs past the 60s default below.
    location = /api/v1/whatsapp/export {
        limit_req zone=granary_api burst=50 nodelay;
        proxy_pass         http://granary_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Sending a document renders its PDF and waits for WhatsApp / SMTP in one request — longer
    # than /api/'s 60 s. Cutting it short made the browser report a failure for a send that went
    # through, inviting a duplicate resend.
    location /api/v1/documents/ {
        limit_req zone=granary_api burst=50 nodelay;
        proxy_pass         http://granary_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # One-time upload links (5 Nov 2026): the drop page PUTs a whole file (a site video up to
    # nary.upload.video_max_mb) in one request, from a phone on a slow line. Larger bodies than the
    # server-wide 150m, 10 minutes each way, and no request buffering: the backend streams the body
    # and cuts it at its own cap. No login; the backend limits requests per address and per link.
    location /api/v1/public/drop/ {
        limit_req zone=granary_api burst=50 nodelay;
        client_max_body_size 160m;
        proxy_request_buffering off;
        proxy_pass         http://granary_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # Backend API
    location /api/ {
        limit_req zone=granary_api burst=50 nodelay;
        proxy_pass         http://granary_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # MCP agents' browser login: the OAuth discovery documents live at the site root but are served by the backend
    # (backend/app/routers/mcp_oauth.py). Certbot's /.well-known/acme-challenge is not matched by this prefix.
    location /.well-known/oauth- {
        proxy_pass         http://granary_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # MCP sign-in codes and token refresh: strict, like the login
    location /api/v1/mcp/oauth/ {
        limit_req zone=granary_auth burst=10 nodelay;
        proxy_pass         http://granary_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # FastAPI auth endpoint — stricter rate limit
    location /api/v1/auth/login {
        limit_req zone=granary_auth burst=10 nodelay;
        proxy_pass       http://granary_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://granary_backend;
    }

    # The S3 storage (SeaweedFS), read-only: the public bucket, and short presigned links (MINIO_PUBLIC_URL =
    # https://<this host>/minio) to the private ones. The links are signed for the browser's host, so the storage
    # gets that Host. The files are other people's: nothing in them may run here (add_header here replaces the
    # server-level headers).
    location /minio/ {
        limit_except GET HEAD { deny all; }
        proxy_pass       http://127.0.0.1:9000/;
        proxy_set_header Host         $http_host;
        proxy_set_header X-Real-IP    $remote_addr;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy $granary_minio_csp always;
        add_header X-Content-Type-Options  "nosniff"                    always;
        add_header X-Frame-Options         "SAMEORIGIN"                 always;
        add_header Referrer-Policy         "no-referrer"                always;
        add_header Strict-Transport-Security "max-age=31536000"         always;
    }

    # Next.js static assets — long-lived cache
    location /_next/static/ {
        proxy_pass         http://granary_frontend;
        proxy_set_header   x-middleware-subrequest "";   # Next.js middleware bypass (CVE-2025-29927)
        proxy_set_header   Host $host;
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }

    # Frontend (Next.js) — WebSocket upgrade support for messaging/calls
    location / {
        proxy_pass         http://granary_frontend;
        proxy_set_header   x-middleware-subrequest "";   # Next.js middleware bypass (CVE-2025-29927)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
