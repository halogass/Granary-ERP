[package]
license.workspace = true
name = "granary-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["catch-panic"] }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
redis.workspace = true
once_cell.workspace = true
regex.workspace = true
granary-compat.workspace = true
# Same crates (and exact versions) pydantic-core 2.27.1 uses, so date/datetime parsing and integer
# string parsing behave and word their errors exactly like the Python backend.
speedate = "=0.15.0"
jiter = "=0.7.1"
indexmap = "2"
strum = "0.26"
unicode-normalization = "0.1"
form_urlencoded = "1"
http-body-util = "0.1"

[dev-dependencies]
granary-db.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
