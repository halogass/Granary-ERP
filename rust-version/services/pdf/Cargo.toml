[package]
license.workspace = true
name = "granary-pdf"
description = "PDF service (port of services/pdf): Handlebars templates rendered by headless Chromium over CDP"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "granary-pdf"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
fancy-regex = { workspace = true }
once_cell = { workspace = true }
dotenvy = "0.15"
handlebars = "6"
url = "2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
flate2 = "1"
libc = "0.2"

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
regex = { workspace = true }
# 23 Oct: the edge-to-edge letterhead test draws the PDF page and reads its text
granary-services.workspace = true
