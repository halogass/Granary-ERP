name: Bug report
description: Something in Granary does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first. Security problems must NOT be reported here:
        see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Sales > Quotations
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Granary version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CRM and inboxes, Sales and approvals, Finance, Procurement, Manufacturing and inventory, Operations, HR and face clock-in, Projects and R&D, Knowledge, Collaboration, Partners, Marketing, Nary (AI) or MCP, Installation or upgrade, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal or customer data before pasting.
      render: shell
