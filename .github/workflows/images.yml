name: Images

# Builds every Granary image (docker-bake.hcl) and pushes it to ghcr.io/halogass/granary-* on a release tag.
# Run it by hand (Actions > Images > Run workflow) to check that everything builds; a manual run pushes nothing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # the runner's preinstalled toolkits Granary doesn't use (about 30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Version and tags
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "extra=${version%.*},latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign in to GHCR
        if: steps.v.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on a tag)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          EXTRA_TAGS: ${{ steps.v.outputs.extra }}
          CARGO_BUILD_JOBS: "4"
        run: |
          if [ "${{ steps.v.outputs.push }}" = "true" ]; then out="--push"; else out="--set=*.output=type=cacheonly"; fi
          docker buildx bake -f docker-bake.hcl --progress=plain $out
          df -h /
